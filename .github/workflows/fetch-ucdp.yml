name: fetch-ucdp

# Weekly: UCDP GED conflict events for the Middle East, then the rule-based
# event catalog data/events/mideast-conflict-ucdp.csv. Needs the repository
# secret UCDP_TOKEN (UCDP issues tokens by email); skipped cleanly without it.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch UCDP GED and build the catalog
        env:
          UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}
        run: |
          if [ -z "$UCDP_TOKEN" ]; then
            echo 'UCDP_TOKEN is not set; nothing to do.'
            exit 0
          fi
          python scripts/fetch_ucdp.py
          python scripts/build_ucdp_catalog.py
          python -m unittest discover -s tests
      - name: Commit (retries if main moved)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [ -f data/events/mideast-conflict-ucdp.csv ] || exit 0
          mkdir -p /tmp/ucdp && cp -r data/ucdp /tmp/ucdp/ && cp data/events/mideast-conflict-ucdp.csv /tmp/ucdp/
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p data/ucdp && cp -r /tmp/ucdp/ucdp/. data/ucdp/
            cp /tmp/ucdp/mideast-conflict-ucdp.csv data/events/
            git add -A data/ucdp data/events/mideast-conflict-ucdp.csv
            if git diff --cached --quiet; then echo 'Nothing new.'; exit 0; fi
            git commit -q -m "UCDP events $(date -u +%F)"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 10
          done
          exit 1
