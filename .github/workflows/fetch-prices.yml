name: fetch-prices

# Daily: prices (EIA: Brent, WTI, Henry Hub; Norges Bank: USD/NOK) into data/prices/,
# headlines (GDELT) into data/news/, and the brief into reports/latest.md.
# EIA publishes with a lag of a few days; a daily run keeps the file current.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'     # 06:23 UTC every day: weekends too, so Saturday news is screened
    - cron: '47 10 * * *'    # backup: GitHub sometimes delays or skips scheduled runs;
                             # a second run on the same day is harmless (same data, fresh brief)

permissions:
  contents: write
  models: read      # GitHub Models (free) for the AI headline screen

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch prices
        id: fetch
        continue-on-error: true   # keep the assets that did succeed
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/fetch_prices.py
      - name: Run event study on the new data
        shell: bash
        run: |
          set -o pipefail   # a failing study must fail the step, not hide behind tee
          python scripts/event_study.py | tee study.txt
      - name: Add study to the run summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat study.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch headlines (GDELT)
        id: news
        continue-on-error: true   # the brief says "news unavailable" instead
        run: python scripts/fetch_news.py
      - name: AI screen of headlines (Groq, then GitHub Models)
        continue-on-error: true   # the brief falls back to the keyword screen
        # Runs even if this fetch failed: an earlier fetch from today may exist.
        # Stale news gives a status for an older date, which the brief ignores.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ai_screen.py
      - name: Suggest new events from headlines
        continue-on-error: true   # never block the day's commit
        run: python scripts/suggest_events.py
      - name: Write the daily brief
        run: |
          mkdir -p data/news reports
          python scripts/daily_report.py > /dev/null
      - name: Backtest (is the tool right?)
        continue-on-error: true
        run: python scripts/backtest.py > /dev/null
      - name: Commit prices, news and brief (retries if main moved)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Keep what this run fetched; everything derived is rebuilt on top of
          # the latest main, so an approval pushed meanwhile is never overwritten.
          mkdir -p /tmp/fetched && cp -r data/prices data/news /tmp/fetched/
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/fetched/prices /tmp/fetched/news data/
            python scripts/suggest_events.py || true
            python scripts/daily_report.py > /dev/null
            python scripts/backtest.py > /dev/null || true
            rm -f /tmp/predlog_failed
            python scripts/prediction_log.py > /dev/null || { echo '::error::prediction log failed'; touch /tmp/predlog_failed; }
            git add -A data/prices data/news data/events/candidates.csv data/predictions reports
            if git diff --cached --quiet; then echo 'Nothing new.'; exit 0; fi
            git commit -q -m "Daily data and brief $(date -u +%F)"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "main moved; rebuilding on top of it ($attempt)"
            sleep 10
          done
          exit 1
      - name: Fail the run if the prediction log failed
        run: |
          if [ -f /tmp/predlog_failed ]; then
            echo 'The prediction log did not update; see the commit step.'
            exit 1
          fi
      - name: Fail the run if any asset failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo 'At least one asset failed to fetch; see the Fetch prices step.'
          exit 1
