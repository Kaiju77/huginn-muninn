name: fetch-prices

# Daily prices (EIA: Brent, WTI, Henry Hub; Norges Bank: USD/NOK) into data/prices/.
# EIA publishes with a lag of a few days; a daily run keeps the file current.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1-5'   # 06:23 UTC on weekdays

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch prices
        id: fetch
        continue-on-error: true   # keep the assets that did succeed
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/fetch_prices.py
      - name: Run event study on the new data
        run: python scripts/event_study.py | tee study.txt
      - name: Add study to the run summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat study.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit if prices changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices/*.csv
          if git diff --cached --quiet; then
            echo 'No new prices.'
          else
            git commit -m "Update prices $(date -u +%F)"
            git push
          fi
      - name: Fail the run if any asset failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo 'At least one asset failed to fetch; see the Fetch prices step.'
          exit 1
